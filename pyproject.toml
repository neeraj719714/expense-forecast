[project]
name = "expense-forecast"
version = "0.1.0"
description = "a personal finance tracker and forecaster"
readme = "README.md"
authors = [
    { name = "Neeraj", email = "neerajkumar719714@gmail.com" }
]
requires-python = ">=3.14"
dependencies = []

[project.scripts]
expense-forecast = "expense_forecast:main"

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "poethepoet>=0.48.0",
    "pytest>=9.1.1",
    "ruff>=0.16.8",
    "ty>=0.0.82",
]

[tool.poe.tasks]
test = "pytest"
lint = "ruff check ."
typecheck = "ty check src"
format = "ruff format ."
fix = ["format", { cmd = "ruff check --fix ." }]
check = ["lint", "typecheck", "test"]
